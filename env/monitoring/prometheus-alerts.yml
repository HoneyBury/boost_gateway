# Boost Gateway v3.6.2 production alert rules.
#
# These rules intentionally reference only metrics exposed by the current
# gateway `/metrics` endpoint or common optional exporters. Backend services do
# not expose HTTP `/metrics`; backend health is inferred from gateway RED
# counters until a backend exporter is implemented.

groups:
  - name: boost-gateway.availability
    rules:
      - alert: BoostGatewayScrapeDown
        expr: up{job="gateway"} == 0
        for: 1m
        labels:
          severity: critical
          component: gateway
        annotations:
          summary: "Boost Gateway scrape target is down"
          description: "Prometheus cannot scrape gateway /metrics for more than 1 minute."

      - alert: BoostGatewayNoRecentAccepts
        expr: sum(rate(gateway_accepted_sessions_total[10m])) == 0 and max(gateway_active_sessions) > 0
        for: 10m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway has active sessions but no recent accepts"
          description: "The gateway is still scraped, but accepted-session traffic has stopped while active sessions remain."

  - name: boost-gateway.backend-red
    rules:
      - alert: BoostGatewayBackendErrors
        expr: >-
          sum(rate(gateway_backend_login_errors_total[5m]))
          + sum(rate(gateway_backend_room_errors_total[5m]))
          + sum(rate(gateway_backend_battle_errors_total[5m]))
          + sum(rate(gateway_backend_matchmaking_errors_total[5m]))
          + sum(rate(gateway_backend_leaderboard_errors_total[5m])) > 0
        for: 2m
        labels:
          severity: warning
          component: backend-routing
        annotations:
          summary: "Backend routing errors detected"
          description: "Gateway backend RED counters report route errors. Check /metrics/diagnostics/json and backend logs."

      - alert: BoostGatewayBackendTimeouts
        expr: >-
          sum(rate(gateway_backend_login_timeouts_total[5m]))
          + sum(rate(gateway_backend_room_timeouts_total[5m]))
          + sum(rate(gateway_backend_battle_timeouts_total[5m]))
          + sum(rate(gateway_backend_matchmaking_timeouts_total[5m]))
          + sum(rate(gateway_backend_leaderboard_timeouts_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          component: backend-routing
        annotations:
          summary: "Backend routing timeouts detected"
          description: "Gateway backend RED counters report timeouts. This can indicate backend outage, network loss, or overload."

      - alert: BoostGatewayLeaderboardBackendErrors
        expr: rate(gateway_backend_leaderboard_errors_total[5m]) + rate(gateway_backend_leaderboard_timeouts_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          component: redis-dependent-leaderboard
        annotations:
          summary: "Leaderboard backend errors or timeouts detected"
          description: "Leaderboard failures may indicate Redis degradation or leaderboard backend issues. Verify redis-cli ping and leaderboard logs."

      - alert: BoostGatewayRedisUnavailable
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis is unavailable to redis_exporter"
          description: "redis_exporter cannot reach Redis. Verify the Redis container, persistence volume, and dependent leaderboard operations."

      - alert: BoostGatewayHighRouteLatency
        expr: max({__name__=~"gateway_backend_.*_p99_latency_us"}) > 200000
        for: 5m
        labels:
          severity: warning
          component: backend-routing
        annotations:
          summary: "Backend route P99 latency is elevated"
          description: "Gateway backend route P99 latency exceeded 200ms. Use /metrics/json, /metrics/diagnostics/json, and gateway_backend_route_latency_us_bucket to identify the degraded backend path."

      - alert: BoostGatewayRedisExporterDown
        expr: up{job="redis-exporter"} == 0
        for: 2m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis exporter scrape target is down"
          description: "Prometheus cannot scrape redis-exporter. Redis runtime metrics visibility is degraded."

      - alert: BoostGatewayRedisMemoryHigh
        expr: redis_memory_used_bytes / redis_total_system_memory_bytes > 0.80
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis memory usage is high"
          description: "Redis memory usage exceeded 80% of system memory exposed by redis_exporter."

  - name: boost-gateway.protection
    rules:
      - alert: BoostGatewayHighActiveSessions
        expr: max(gateway_active_sessions) > 9000
        for: 5m
        labels:
          severity: warning
          component: gateway
        annotations:
          summary: "Gateway active sessions are close to capacity"
          description: "Active sessions exceeded the current production warning threshold. Compare with release/capacity baseline."

  - name: boost-gateway.host-and-container
    rules:
      - alert: BoostGatewayNodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          component: host-observability
        annotations:
          summary: "Node exporter scrape target is down"
          description: "Host CPU, load, memory, filesystem, disk, network, thermal, and systemd visibility is unavailable."

      - alert: BoostGatewayCadvisorDown
        expr: up{job="cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
          component: container-observability
        annotations:
          summary: "cAdvisor scrape target is down"
          description: "Container CPU, memory, and lifecycle visibility is unavailable."

      - alert: BoostGatewayHostLoadHigh
        expr: node_load1 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host load is high"
          description: "One-minute host load has exceeded 1.5 per logical CPU for 15 minutes."

      - alert: BoostGatewayHostMemoryHigh
        expr: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Host memory pressure is high"
          description: "Available host memory has remained below 10 percent for 10 minutes."

      - alert: BoostGatewayHostFilesystemLow
        expr: node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"} / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.10
        for: 10m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Host filesystem free space is low"
          description: "A persistent filesystem has remained below 10 percent available space for 10 minutes."

      - alert: BoostGatewayHostTemperatureHigh
        expr: max(node_hwmon_temp_celsius or node_thermal_zone_temp) > 85
        for: 10m
        labels:
          severity: warning
          component: host-thermal
        annotations:
          summary: "Host temperature is high"
          description: "A reported hwmon or thermal-zone sensor has remained above 85 degrees Celsius for 10 minutes."

      - alert: BoostGatewayContainerRestarted
        expr: changes(boost_gateway_container_restart_count[15m]) > 0
        labels:
          severity: warning
          component: containers
        annotations:
          summary: "Boost Gateway container restarted"
          description: "The governed Docker restart counter changed for a container in the last 15 minutes."

      - alert: BoostGatewayContainerRestartCollectorFailed
        expr: boost_gateway_container_restart_collection_success == 0 or time() - boost_gateway_container_restart_collection_timestamp_seconds > 180
        for: 2m
        labels:
          severity: warning
          component: container-observability
        annotations:
          summary: "Container restart collector is incomplete or stale"
          description: "The host collector cannot inspect every governed container or has not refreshed metrics for three minutes."

      - alert: BoostGatewayHighRSS
        expr: process_resident_memory_bytes{job="gateway"} > 1500000000
        for: 10m
        labels:
          severity: warning
          component: gateway
          exporter: optional-process
        annotations:
          summary: "Gateway RSS is high"
          description: "Requires process exporter metrics. RSS exceeded 1.5GB for more than 10 minutes."

      - alert: BoostGatewayHighFileDescriptors
        expr: process_open_fds{job="gateway"} / process_max_fds{job="gateway"} > 0.8
        for: 5m
        labels:
          severity: critical
          component: gateway
          exporter: optional-process
        annotations:
          summary: "Gateway file descriptor usage is high"
          description: "Requires process exporter metrics. Open fd usage is above 80% of the configured limit."

      - alert: BoostGatewayContainerMemoryHigh
        expr: >-
          sum by (container) (
            container_memory_working_set_bytes
            * on (id) group_left (container)
            boost_gateway_container_info
          ) > 1073741824
        for: 10m
        labels:
          severity: warning
          component: containers
          exporter: governed-cadvisor
        annotations:
          summary: "Container memory usage is high"
          description: "One of the core containers exceeded 1 GiB working set."

  - name: boost-gateway.redis-persistence-observability
    rules:
      - alert: BoostGatewayRedisRdbSaveFailed
        expr: redis_rdb_last_bgsave_status == 0
        for: 1m
        labels:
          severity: critical
          component: redis-persistence
        annotations:
          summary: "Redis background save failed"
          description: "redis_exporter reports that the most recent Redis RDB background save did not succeed."

      - alert: BoostGatewayRedisRdbSaveStale
        expr: redis_rdb_changes_since_last_save > 0 and time() - redis_rdb_last_save_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
          component: redis-persistence
        annotations:
          summary: "Redis has unsaved changes"
          description: "Redis reports pending changes and no successful RDB save timestamp within 30 minutes. This observes the current policy without changing it."
