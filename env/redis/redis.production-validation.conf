# Boost Gateway production-validation Redis candidate profile.
#
# This file is intentionally not mounted by the production Compose topology.
# Activation requires measured AOF performance evidence, a governed change record,
# and a rollback plan under TODO-0012.

# Memory pressure must reject writes instead of silently evicting recoverable
# leaderboard state.
maxmemory 256mb
maxmemory-policy noeviction
maxmemory-samples 10

# Retain RDB checkpoints alongside AOF. The 60-second rule protects high-churn
# windows; AOF everysec is the primary low-churn RPO mechanism.
save 300 100
save 60 10000
dbfilename dump.rdb
dir /data
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Redis 7 multi-part AOF with an RDB preamble. Continue fsync during rewrites and
# refuse truncated AOF input instead of accepting an unmeasured data-loss window.
appendonly yes
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
appendfsync everysec
no-appendfsync-on-rewrite no
aof-use-rdb-preamble yes
aof-load-truncated no
aof-timestamp-enabled yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Container-scoped network policy. Host publication remains loopback-only in the
# production topology.
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 1024
timeout 0
tcp-keepalive 300

daemonize no
loglevel notice
logfile ""
databases 1
slowlog-log-slower-than 10000
slowlog-max-len 128
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60
