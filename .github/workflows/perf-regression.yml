name: Performance / Baseline & Regression

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Native production platform"
        required: true
        default: linux-x64
        type: choice
        options:
          - linux-x64
          - linux-arm64
          - macos-arm64
      runner:
        description: 'Runner JSON string or array, for example "ubuntu-latest" or ["self-hosted","Linux","X64"]'
        required: false
        default: ""
      perf_preset:
        description: "Performance preset. Use smoke to replace the retired per-commit performance check."
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - baseline
          - capacity
          - business-capacity
          - saturation
          - business-saturation
          - business-open-saturation
      perf_repetitions:
        description: "Number of repetitions per case"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "3"
      perf_case:
        description: "Optional exact case name from the selected preset"
        required: false
        default: ""
        type: string
      run_architecture_comparison:
        description: "Compare architecture microbenchmarks against a baseline on Linux x64"
        required: true
        default: true
        type: boolean
      architecture_baseline_ref:
        description: "Git branch, tag, or commit containing the same benchmark harness"
        required: true
        default: "main"
      architecture_repetitions:
        description: "Paired architecture benchmark repetitions"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "7"

permissions:
  contents: read
  actions: read

jobs:
  performance:
    runs-on: ${{ fromJSON(inputs.runner || (inputs.platform == 'linux-x64' && '["self-hosted","Linux","X64","node-aoi-omen-gaming-laptop-16-am0xxx"]' || inputs.platform == 'linux-arm64' && '["self-hosted","Linux","ARM64","node-honeybury-m4-linux-arm64"]' || '["self-hosted","macOS","ARM64","macos-arm64-candidate"]')) }}
    concurrency:
      group: perf-regression-${{ inputs.platform }}-${{ inputs.runner || 'fixed-runner' }}
      cancel-in-progress: false

    steps:
      - name: Normalize stale Go cache permissions
        if: inputs.platform != 'macos-arm64'
        shell: bash
        run: |
          set -euo pipefail
          cache="$GITHUB_WORKSPACE/runtime/go-cache"
          if [ -d "$cache" ]; then
            docker run --rm --pull=never --network=none \
              -v "$cache:/cache" ubuntu:24.04 chmod -R a+rwX /cache
          fi

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Resolve native production platform
        uses: ./.github/actions/resolve-production-platform
        with:
          platform: ${{ inputs.platform }}

      - name: Setup C++ Conan toolchain
        uses: ./.github/actions/setup-cpp-conan
        with:
          bootstrap-args: "--no-remote"
          conan-venv-offline: "true"
          cache-build-type: Release
          conan-venv: ${{ env.BOOST_GATEWAY_CONAN_VENV }}
          cache-root: ${{ env.PRODUCTION_CACHE_ROOT }}
          cache-profile: ${{ env.PRODUCTION_CONAN_PROFILE }}
          cache-lockfile: ${{ env.PRODUCTION_RELEASE_LOCKFILE }}

      - name: Conan install
        shell: bash
        run: |
          set -euo pipefail
          conan install . \
            --profile:host "$PRODUCTION_CONAN_PROFILE" \
            --profile:build "$PRODUCTION_CONAN_PROFILE" \
            --lockfile "$PRODUCTION_RELEASE_LOCKFILE" \
            -o "&:with_grpc=False" \
            -o "&:with_raft_protobuf=True" \
            -o "&:with_sqlite=False" \
            --output-folder=build/conan-perf-regression \
            --build=never \
            --no-remote \
            -s build_type=Release

      - name: Install sccache
        shell: bash
        run: |
          set -euo pipefail
          command -v sccache
          echo "SCCACHE_BIN=$(command -v sccache)" >> "$GITHUB_ENV"
          mkdir -p "$SCCACHE_DIR"
          sccache --version

      - name: Reset sccache stats
        shell: bash
        run: sccache --zero-stats || true

      - name: Configure (Release)
        shell: bash
        run: |
          set -euo pipefail
          : "${SCCACHE_BIN:?missing sccache path}"
          mkdir -p runtime/validation
          cmake --preset "$PRODUCTION_CONFIGURE_PRESET" \
            -DBOOST_DEPENDENCY_PROVIDER=conan \
            -DCMAKE_TOOLCHAIN_FILE=build/conan-perf-regression/build/Release/generators/conan_toolchain.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_BIN" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_BIN" \
            2>&1 | tee runtime/validation/perf-regression-configure.log

      - name: Verify Conan dependency provider
        shell: bash
        run: |
          grep -F "Using Conan-provided dependency graph" runtime/validation/perf-regression-configure.log

      - name: Verify sccache wiring
        shell: bash
        run: |
          : "${SCCACHE_BIN:?missing sccache path}"
          grep -F -n "$SCCACHE_BIN" "$PRODUCTION_BUILD_DIR/CMakeCache.txt" "$PRODUCTION_BUILD_DIR/build.ninja"

      - name: Record build start time
        uses: ./.github/actions/record-build-metrics
        with:
          phase: start
          workflow: perf-regression

      - name: Build (Release)
        shell: bash
        run: |
          cmake --build "$PRODUCTION_BUILD_DIR" --parallel
          mkdir -p runtime/perf/build-times
          sccache --show-stats --stats-format json > runtime/perf/build-times/sccache-stats.json

      - name: Prepare architecture baseline worktree
        if: inputs.platform == 'linux-x64' && inputs.run_architecture_comparison
        shell: bash
        env:
          BASELINE_REF: ${{ inputs.architecture_baseline_ref || 'main' }}
        run: |
          set -euo pipefail
          if [[ ! "$BASELINE_REF" =~ ^[0-9A-Za-z][0-9A-Za-z._/-]*$ ]] || [[ "$BASELINE_REF" == *..* ]]; then
            echo "invalid architecture baseline ref" >&2
            exit 2
          fi
          baseline_sha="$(git rev-parse --verify --quiet "${BASELINE_REF}^{commit}" || true)"
          if [ -z "$baseline_sha" ]; then
            git fetch --no-tags --depth=1 origin "$BASELINE_REF"
            baseline_sha="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          fi
          reference_source="$RUNNER_TEMP/boost-gateway-arch-reference-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          reference_build="$reference_source/build/architecture-reference-release"
          git worktree add --detach "$reference_source" "$baseline_sha"
          {
            echo "ARCH_BASELINE_SHA=$baseline_sha"
            echo "ARCH_CANDIDATE_SHA=$GITHUB_SHA"
            echo "ARCH_REFERENCE_SOURCE=$reference_source"
            echo "ARCH_REFERENCE_BUILD=$reference_build"
          } >> "$GITHUB_ENV"

      - name: Build architecture baseline
        if: inputs.platform == 'linux-x64' && inputs.run_architecture_comparison
        shell: bash
        run: |
          set -euo pipefail
          profile="$GITHUB_WORKSPACE/$PRODUCTION_CONAN_PROFILE"
          lockfile="$GITHUB_WORKSPACE/$PRODUCTION_RELEASE_LOCKFILE"
          conan_output="$ARCH_REFERENCE_SOURCE/build/conan-architecture-reference"
          conan install "$ARCH_REFERENCE_SOURCE" \
            --profile:host "$profile" \
            --profile:build "$profile" \
            --lockfile "$lockfile" \
            -o "&:with_grpc=False" \
            -o "&:with_raft_protobuf=True" \
            -o "&:with_sqlite=False" \
            --output-folder="$conan_output" \
            --build=never \
            --no-remote \
            -s build_type=Release
          cmake -S "$ARCH_REFERENCE_SOURCE" -B "$ARCH_REFERENCE_BUILD" -G Ninja \
            -DBOOST_DEPENDENCY_PROVIDER=conan \
            -DCMAKE_TOOLCHAIN_FILE="$conan_output/build/Release/generators/conan_toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_TESTING=ON \
            -DCMAKE_C_COMPILER_LAUNCHER="$SCCACHE_BIN" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="$SCCACHE_BIN"
          cmake --build "$ARCH_REFERENCE_BUILD" --target v2_arch_benchmark --parallel

      - name: Run paired architecture regression gate
        if: inputs.platform == 'linux-x64' && inputs.run_architecture_comparison
        shell: bash
        env:
          REPETITIONS: ${{ inputs.architecture_repetitions || '5' }}
        run: |
          set -euo pipefail
          output_root="runtime/perf/architecture-comparison"
          mkdir -p "$output_root/baseline" "$output_root/candidate"
          candidate_bin="$PRODUCTION_BUILD_DIR/examples/v2_arch_benchmark/v2_arch_benchmark"
          baseline_bin="$ARCH_REFERENCE_BUILD/examples/v2_arch_benchmark/v2_arch_benchmark"
          benchmark_args=(--iterations 10000 --actors 10000 --actor-limit 100000 --battles 2000)
          for repetition in $(seq 1 "$REPETITIONS"); do
            if (( repetition % 2 == 1 )); then
              "$baseline_bin" "${benchmark_args[@]}" \
                --output "$output_root/baseline/$repetition.json" >/dev/null
              "$candidate_bin" "${benchmark_args[@]}" \
                --output "$output_root/candidate/$repetition.json" >/dev/null
            else
              "$candidate_bin" "${benchmark_args[@]}" \
                --output "$output_root/candidate/$repetition.json" >/dev/null
              "$baseline_bin" "${benchmark_args[@]}" \
                --output "$output_root/baseline/$repetition.json" >/dev/null
            fi
          done

          compare_args=(
            --config config/perf/v2_arch_baseline_gates.json
            --baseline-ref "$ARCH_BASELINE_SHA"
            --candidate-ref "$ARCH_CANDIDATE_SHA"
            --output "$output_root/comparison-summary.json"
          )
          for repetition in $(seq 1 "$REPETITIONS"); do
            compare_args+=(
              --baseline "$output_root/baseline/$repetition.json"
              --candidate "$output_root/candidate/$repetition.json"
            )
          done
          python3 scripts/gates/release/compare_v2_arch_baselines.py "${compare_args[@]}"
          python3 scripts/producers/collect_v2_arch_baseline.py \
            --build-dir "$PRODUCTION_BUILD_DIR" \
            --output-root "$output_root/candidate-absolute" \
            --gate-profile release \
            --timeout-seconds 60

      - name: Run performance baseline
        id: perf
        shell: bash
        env:
          V2_RATE_LIMIT_CONNECTION: "100000"
          V2_RATE_LIMIT_MESSAGE_TYPE: "200000"
          V2_RATE_LIMIT_IP: "200000"
          V2_RATE_LIMIT_USER: "100000"
          V2_RATE_LIMIT_LOGIN: "50000"
          PERF_CASE: ${{ inputs.perf_case }}
        run: |
          OUTPUT_DIR="runtime/perf/ci-regression-$(date +%Y%m%d-%H%M%S)"
          isolation_args=()
          case_args=()
          perf_preset="${{ inputs.perf_preset || 'baseline' }}"
          if [ -n "$PERF_CASE" ]; then
            case_args+=(--case "$PERF_CASE")
          fi
          if [[ "$perf_preset" == saturation || "$perf_preset" == business-saturation || "$perf_preset" == business-open-saturation ]]; then
            if [ "${{ inputs.platform }}" != linux-x64 ]; then
              echo "saturation presets currently require the AOI Linux x64 runner" >&2
              exit 2
            fi
            isolation_args+=(--cpu-set 0-1 --loadgen-cpu-set 4-7 --loadgen-io-threads 4)
          elif [ "${{ inputs.platform }}" = linux-arm64 ]; then
            isolation_args+=(--cpu-set 0-7 --loadgen-cpu-set 8-11)
          fi
          python3 scripts/producers/collect_v2_perf_baseline.py \
            --build-dir "$PRODUCTION_BUILD_DIR" \
            --run-preset "$perf_preset" \
            --repetitions ${{ inputs.perf_repetitions || '1' }} \
            --backend-pool-size 8 \
            --battle-route-workers 8 \
            "${case_args[@]}" \
            "${isolation_args[@]}" \
            --output-root "$OUTPUT_DIR" \
            2>&1 | tee perf_run.log

          echo "output_dir=$OUTPUT_DIR" >> "$GITHUB_OUTPUT"

      - name: Evaluate performance gates
        id: gates
        shell: bash
        env:
          PERF_PRESET: ${{ inputs.perf_preset || 'baseline' }}
        run: |
          SUMMARY_PATH="${{ steps.perf.outputs.output_dir }}/summary.json"
          if [ ! -f "$SUMMARY_PATH" ]; then
            echo "No summary.json found - performance run may have failed."
            exit 1
          fi

          SUMMARY_PATH="$SUMMARY_PATH" GITHUB_STEP_SUMMARY="$GITHUB_STEP_SUMMARY" python - <<'PY'
          import json
          import os
          import sys

          with open(os.environ["SUMMARY_PATH"], encoding="utf-8") as f:
              summary = json.load(f)

          release_gates = summary.get("release_gates")
          if not isinstance(release_gates, dict):
              print("summary.json is missing release_gates")
              sys.exit(1)

          checks = release_gates.get("checks", [])
          warnings = release_gates.get("warnings", [])
          overall_pass = release_gates.get("overall_pass") is True
          verdict_source = "release_gates.overall_pass"
          if os.environ["PERF_PRESET"] in {
              "saturation",
              "business-saturation",
              "business-open-saturation",
          }:
              saturation = summary.get("saturation_analysis")
              if not isinstance(saturation, dict):
                  print("summary.json is missing saturation_analysis")
                  sys.exit(1)
              overall_pass = saturation.get("overall_pass") is True
              verdict_source = "saturation_analysis.overall_pass"
          report_lines = ["## Performance Gate Results", ""]
          report_lines.append(f"- Overall pass: `{overall_pass}`")
          report_lines.append(f"- Verdict source: `{verdict_source}`")
          report_lines.append("")
          report_lines.append("| Case | Verdict | Observed P99 | Criteria |")
          report_lines.append("| --- | --- | ---: | --- |")

          for check in checks:
              observed = check.get("observed", {})
              p99_ms = observed.get("p99_ms")
              p99_display = f"{p99_ms:.0f}ms" if isinstance(p99_ms, (int, float)) else "n/a"
              verdict = "PASS" if check.get("passed") else "FAIL"
              report_lines.append(
                  f"| {check.get('case', 'unknown')} | {verdict} | {p99_display} | "
                  f"{check.get('criteria', 'n/a')} |"
              )

          if warnings:
              report_lines.extend(["", "### Warnings", ""])
              for warning in warnings:
                  report_lines.append(
                      f"- `{warning.get('case', 'unknown')}`: {warning.get('warning', 'warning')}"
                  )

          report = "\n".join(report_lines)
          print(report)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as outf:
              outf.write(report + "\n")

          sys.exit(0 if overall_pass else 1)
          PY

      - name: Generate performance report
        if: always()
        shell: bash
        run: |
          SUMMARY_PATH="${{ steps.perf.outputs.output_dir }}/summary.json"
          if [ -f "$SUMMARY_PATH" ]; then
            REPORT_DIR="$(dirname "$SUMMARY_PATH")"
            echo "## Performance Regression Summary" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Workflow**: ${{ github.workflow }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Platform**: $PRODUCTION_PLATFORM" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Preset**: ${{ inputs.perf_preset || 'baseline' }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Repetitions**: ${{ inputs.perf_repetitions || '1' }}" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Report**: See artifact \`perf-report-$PRODUCTION_PLATFORM\`" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            if [ -f "$REPORT_DIR/report.md" ]; then
              cat "$REPORT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: perf-report-${{ inputs.platform }}-${{ github.run_id }}
          path: |
            runtime/perf/**
            perf_run.log
            runtime/validation/production-platform-summary.json
          if-no-files-found: warn

      - name: Capture build metrics
        if: always()
        uses: ./.github/actions/record-build-metrics
        with:
          phase: finish
          workflow: perf-regression
          production-platform: ${{ env.PRODUCTION_PLATFORM }}

      - name: Clean architecture baseline worktree
        if: always() && env.ARCH_REFERENCE_SOURCE != ''
        shell: bash
        run: git worktree remove --force "$ARCH_REFERENCE_SOURCE"
